name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: mahantsolutions/global
  APP_URL: https://ask-any-repo.getcruisecontrol.com
  SLACK_CHANNEL_ID: C08QM5F5YSU

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff@0.16.8 check .
      - run: uv run python -m unittest

  build_and_push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:ask-your-repo-main
            ${{ env.IMAGE }}:ask-your-repo-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      REMOTE_DIR: /home/${{ secrets.SSH_USER }}/ask-your-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Write .env
        env:
          APP_GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          MCP_TOKEN_SHA256: ${{ secrets.MCP_TOKEN_SHA256 }}
          DEFAULT_BRANCH: ${{ vars.DEFAULT_BRANCH }}
          DOCS_FOLDER_PATH: ${{ vars.DOCS_FOLDER_PATH }}
          MAX_FILE_TOKENS: ${{ vars.MAX_FILE_TOKENS }}
          MCP_INSTRUCTIONS: ${{ vars.MCP_INSTRUCTIONS }}
          ImageTag: ask-your-repo-${{ github.sha }}
        run: bash write_env.sh

      - name: Copy files to server
        run: |
          ssh "$SSH_TARGET" "mkdir -p '$REMOTE_DIR'"
          scp .env docker-compose.yml Caddyfile "$SSH_TARGET:$REMOTE_DIR/"

      - name: Deploy
        run: |
          ssh "$SSH_TARGET" "set -e
            cd '$REMOTE_DIR'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f"

      - name: Health check
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$APP_URL/health"

      - name: Remove local .env
        if: always()
        run: rm -f .env ~/.ssh/id_ed25519

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Re-tags the image built when this commit landed on main; fails if the tag isn't on a main commit.
      - run: >
          docker buildx imagetools create
          --tag "$IMAGE:ask-your-repo-$GITHUB_REF_NAME"
          "$IMAGE:ask-your-repo-$GITHUB_SHA"

  notify:
    needs: [test, build_and_push, deploy, release]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        if: contains(needs.*.result, 'failure')
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: ":x: ask-your-repo CI/CD failed on ${{ github.ref_name }} (${{ github.sha }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify deploy success
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: ":white_check_mark: ask-your-repo deployed to production (${{ github.sha }}) - ${{ env.APP_URL }}"

      - name: Notify release
        if: needs.release.result == 'success'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: ":package: ask-your-repo released ${{ env.IMAGE }}:ask-your-repo-${{ github.ref_name }}"
